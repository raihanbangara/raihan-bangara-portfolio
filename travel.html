<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raihan Bangara — Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0b0d0a; --ink:#f2f4ee; --panel:#14160d; --on-panel:#f2f4ee; --card:#15170f;
    --border:#23261d; --border-dark:#363a2c; --accent:#d7f24e; --accent-soft:#b3c66a;
    --m1:#8f9a86; --m2:#7c8672; --m3:#697263; --m4:#565e52;
    --land:#1b1e15; --land-line:#343a29; --grat:#14160f; --sphere:#343a29;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;line-height:1.55}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--ink)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 44px}
  header a{display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:10px 0;margin:-10px 0}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
  #globe{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #globe.dragging{cursor:grabbing}
  #tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-140%);transition:opacity .12s;
       background:var(--panel);color:var(--on-panel);padding:9px 13px;white-space:nowrap;z-index:5}
  /* keep the fixed theme pill out of the city-list lane on narrow-ish viewports */
  @media (max-width:1260px){ #side{padding-right:66px} }
  @media (max-width:900px){
    .split{grid-template-columns:1fr !important}
    .wrap{padding:0 22px}
    #side{padding-right:0;padding-bottom:76px}
    .globe-box{min-height:0 !important}
    header{flex-wrap:wrap;row-gap:10px}
    footer{margin-left:-22px !important;margin-right:-22px !important;padding-left:22px !important;padding-right:22px !important}
    footer > div{flex-direction:column;align-items:flex-start !important}
  }
  @media (max-width:480px){
    .wrap{padding:0 16px}
    footer{margin-left:-16px !important;margin-right:-16px !important;padding-left:16px !important;padding-right:16px !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header style="display:flex;justify-content:space-between;align-items:center;padding:26px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--m2);font-family:'IBM Plex Mono',monospace">
    <a href="index.html" style="color:var(--ink)">← Raihan Bangara</a>
    <span>Places</span>
  </header>

  <section style="border-top:1px solid var(--border);padding:76px 0 44px">
    <div class="mono" style="font-size:12px;letter-spacing:.16em;color:var(--accent);margin-bottom:30px">03 — Where I've been</div>
    <h1 style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(42px,6vw,84px);line-height:1.02;letter-spacing:-.02em;margin:0 0 28px;max-width:18ch">Every city that taught me something.</h1>
    <p style="font-size:18px;color:var(--m1);margin:0;max-width:58ch;text-wrap:pretty">Drag to spin the globe, pinch to zoom. Hover (or tap) a dot to reveal the city and country.</p>
  </section>

  <section class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:56px;align-items:start;padding-bottom:96px">
    <div class="globe-box" style="position:relative;aspect-ratio:1/1;min-height:360px">
      <canvas id="globe"></canvas>
      <div id="tip">
        <div class="mono" id="tip-city" style="font-size:13px;letter-spacing:.06em;color:var(--on-panel)"></div>
        <div class="mono" id="tip-country" style="font-size:10.5px;color:var(--m4);margin-top:4px"></div>
      </div>
    </div>
    <div id="side">
      <div class="mono" style="font-size:12px;letter-spacing:.16em;color:var(--m2);margin-bottom:8px"><span id="count">0</span> cities · <span id="countries">0</span> countries</div>
      <p class="mono" style="font-size:10.5px;letter-spacing:.1em;color:var(--m4);margin-top:22px;margin-bottom:64px;line-height:1.8">Geometry: Natural Earth<br>via world-atlas + d3-geo</p>
    </div>
  </section>

  <footer style="background:var(--panel);color:var(--on-panel);margin:0 -44px;padding:64px 44px 48px">
    <div style="max-width:1092px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:20px">
      <a href="index.html" style="font-family:'Instrument Serif',Georgia,serif;font-size:34px;color:var(--on-panel)">Back to the work →</a>
      <span class="mono" style="font-size:11px;letter-spacing:.1em;color:var(--m3)">Bay Area · 2026</span>
    </div>
  </footer>
</div>

<script>
// ——— Edit this list: name, country, [longitude, latitude], optional note ———
const CITIES = [
  { city:'Mumbai',        country:'India',          coords:[72.8777, 19.0760] },
  { city:'Goa',           country:'India',          coords:[74.1240, 15.2993] },
  { city:'Pune',          country:'India',          coords:[73.8567, 18.5204] },
  { city:'Aurangabad',    country:'India',          coords:[75.3433, 19.8762] },
  { city:'Bhopal',        country:'India',          coords:[77.4126, 23.2599] },
  { city:'New Delhi',     country:'India',          coords:[77.2090, 28.6139] },
  { city:'Jaipur',        country:'India',          coords:[75.7873, 26.9124] },
  { city:'Chandigarh',    country:'India',          coords:[76.7794, 30.7333] },
  { city:'Shimla',        country:'India',          coords:[77.1734, 31.1048] },
  { city:'Kashmir',       country:'India',          coords:[74.7973, 34.0837] },
  { city:'Kolkata',       country:'India',          coords:[88.3639, 22.5726] },
  { city:'Hyderabad',     country:'India',          coords:[78.4867, 17.3850] },
  { city:'Bengaluru',     country:'India',          coords:[77.5946, 12.9716] },
  { city:'Ooty',          country:'India',          coords:[76.6950, 11.4102] },
  { city:'Coimbatore',    country:'India',          coords:[76.9558, 11.0168] },
  { city:'Colombo',       country:'Sri Lanka',      coords:[79.8612, 6.9271] },
  { city:'Tokyo',         country:'Japan',          coords:[139.6917, 35.6895] },
  { city:'Kagoshima',     country:'Japan',          coords:[130.5571, 31.5966] },
  { city:'Akita',         country:'Japan',          coords:[140.1063, 39.7186] },
  { city:'Aomori',        country:'Japan',          coords:[140.7400, 40.8244] },
  { city:'Busan',         country:'South Korea',    coords:[129.0756, 35.1796] },
  { city:'Cairo',         country:'Egypt',          coords:[31.2357, 30.0444] },
  { city:'Johannesburg',  country:'South Africa',   coords:[28.0473, -26.2041] },
  { city:'Cape Town',     country:'South Africa',   coords:[18.4241, -33.9249] },
  { city:'Reykjavík',     country:'Iceland',        coords:[-21.8277, 64.1265] },
  { city:'London',        country:'United Kingdom', coords:[-0.1276, 51.5072] },
  { city:'Paris',         country:'France',         coords:[2.3522, 48.8566] },
  { city:'Nice',          country:'France',         coords:[7.2620, 43.7102] },
  { city:'Monaco',        country:'Monaco',         coords:[7.4246, 43.7384] },
  { city:'Geneva',        country:'Switzerland',    coords:[6.1432, 46.2044] },
  { city:'Salzburg',      country:'Austria',        coords:[13.0550, 47.8095] },
  { city:'Milan',         country:'Italy',          coords:[9.1900, 45.4642] },
  { city:'Florence',      country:'Italy',          coords:[11.2558, 43.7696] },
  { city:'Barcelona',     country:'Spain',          coords:[2.1734, 41.3851] },
  { city:'Madrid',        country:'Spain',          coords:[-3.7038, 40.4168] },
  { city:'Lisbon',        country:'Portugal',       coords:[-9.1393, 38.7223] },
  { city:'Boston',        country:'United States',  coords:[-71.0589, 42.3601] },
  { city:'New York',      country:'United States',  coords:[-74.0060, 40.7128] },
  { city:'Miami',         country:'United States',  coords:[-80.1918, 25.7617] },
  { city:'Mexico City',   country:'Mexico',         coords:[-99.1332, 19.4326] },
  { city:'Cancun',        country:'Mexico',         coords:[-86.8515, 21.1619] },
  { city:'Phoenix',       country:'United States',  coords:[-112.0740, 33.4484] },
  { city:'Las Vegas',     country:'United States',  coords:[-115.1398, 36.1699] },
  { city:'Oahu',          country:'Hawaii, USA',    coords:[-157.9583, 21.4667] },
  { city:'Los Angeles',   country:'United States',  coords:[-118.2437, 34.0522] },
  { city:'San Francisco', country:'United States',  coords:[-122.4194, 37.7749] },
  { city:'Seattle',       country:'United States',  coords:[-122.3321, 47.6062] },
  { city:'Vancouver',     country:'Canada',         coords:[-123.1207, 49.2827] },
  { city:'Ketchikan',     country:'Alaska, USA',    coords:[-131.6461, 55.3422] },
  { city:'Juneau',        country:'Alaska, USA',    coords:[-134.4197, 58.3019] }
];

const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
const tipCity = document.getElementById('tip-city');
const tipCountry = document.getElementById('tip-country');
document.getElementById('count').textContent = CITIES.length;
document.getElementById('countries').textContent =
  new Set(CITIES.map(c => c.country.replace('Alaska, USA', 'United States').replace('Hawaii, USA', 'United States'))).size;

let land = null, borders = null;
const graticule = d3.geoGraticule10();
const projection = d3.geoOrthographic().rotate([-20, -14]);
const path = d3.geoPath(projection, ctx);

let W = 0, H = 0, dpr = 1;
let active = -1, spinning = true, dragging = false, target = null;
let baseScale = 0, zoom = 1;
const ZOOM_MIN = 0.6, ZOOM_MAX = 2.5;

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function applyZoom(z) {
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  projection.scale(baseScale * zoom);
}

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  W = r.width; H = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  baseScale = Math.min(W, H) / 2 - 8;
  projection.scale(baseScale * zoom).translate([W / 2, H / 2]);
  draw();
}

function draw() {
  const c = {
    land: css('--land'), line: css('--land-line'), grat: css('--grat'),
    sphere: css('--sphere'), bg: css('--bg'), accent: css('--accent'), ink: css('--ink')
  };
  ctx.clearRect(0, 0, W, H);

  ctx.beginPath(); path({ type: 'Sphere' });
  ctx.fillStyle = c.bg; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = c.sphere; ctx.stroke();

  ctx.beginPath(); path(graticule);
  ctx.lineWidth = 0.6; ctx.strokeStyle = c.grat; ctx.stroke();

  if (land) {
    ctx.beginPath(); path(land);
    ctx.fillStyle = c.land; ctx.fill();
    ctx.lineWidth = 0.7; ctx.strokeStyle = c.line; ctx.stroke();
  }

  const center = [-projection.rotate()[0], -projection.rotate()[1]];
  CITIES.forEach((city, i) => {
    if (d3.geoDistance(city.coords, center) > Math.PI / 2 - 0.02) return;
    const p = projection(city.coords);
    const on = i === active;
    if (on) {
      ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, 2 * Math.PI);
      ctx.fillStyle = c.accent; ctx.globalAlpha = .18; ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(p[0], p[1], on ? 5 : 3.4, 0, 2 * Math.PI);
    ctx.fillStyle = on ? c.ink : c.accent; ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = c.bg; ctx.stroke();
  });

  // tooltip follows the active dot
  if (active >= 0) {
    const city = CITIES[active];
    if (d3.geoDistance(city.coords, center) <= Math.PI / 2 - 0.02) {
      const p = projection(city.coords);
      tip.style.left = p[0] + 'px';
      tip.style.top = p[1] + 'px';
      tipCity.textContent = city.city;
      tipCountry.textContent = city.country;
      tip.style.opacity = 1;
    } else { tip.style.opacity = 0; }
  }
}

function hideTip() { tip.style.opacity = 0; }

function hitTest(x, y, threshold) {
  const center = [-projection.rotate()[0], -projection.rotate()[1]];
  let hit = -1, best = threshold;
  CITIES.forEach((city, i) => {
    if (d3.geoDistance(city.coords, center) > Math.PI / 2 - 0.02) return;
    const p = projection(city.coords);
    const d = Math.hypot(p[0] - x, p[1] - y);
    if (d < best) { best = d; hit = i; }
  });
  return hit;
}

function selectPoint(hit) {
  if (hit === active) {
    active = -1; hideTip(); spinning = true;
  } else if (hit !== -1) {
    active = hit; spinning = false;
  } else {
    active = -1; hideTip(); spinning = true;
  }
  draw();
}

// pointer: one finger drags to rotate, two fingers pinch to zoom,
// mouse hover inspects, a touch tap (no movement) selects a point.
let last = null;
const pointers = new Map();
let pinchDist = null, downPos = null, downPointerType = null, dragMoved = false;

function pinchDistance() {
  const pts = [...pointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });

  if (pointers.size >= 2) {
    e.preventDefault();
    dragging = false;
    canvas.classList.remove('dragging');
    pinchDist = pinchDistance();
  } else if (pointers.size === 1) {
    dragging = true;
    last = [e.offsetX, e.offsetY];
    downPos = last;
    downPointerType = e.pointerType;
    dragMoved = false;
    canvas.classList.add('dragging');
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

  if (pointers.size === 0) {
    if (dragging && downPointerType === 'touch' && !dragMoved) {
      selectPoint(hitTest(downPos[0], downPos[1], 20));
    }
    dragging = false;
    canvas.classList.remove('dragging');
    pinchDist = null;
  } else if (pointers.size === 1) {
    // dropped from a pinch back to one finger: resume single-finger rotate
    const [remaining] = [...pointers.values()];
    dragging = true;
    last = [remaining.x, remaining.y];
    dragMoved = true; // this isn't a tap, it's a mid-gesture transition
    canvas.classList.add('dragging');
    pinchDist = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// iOS Safari's system pinch-zoom gesture recognizer can start before/despite
// touch-action:none and pointer-event preventDefault; blocking it also at the
// touch-event level is the only reliable way to stop it on the canvas.
function blockMultiTouch(e) {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}
canvas.addEventListener('touchstart', blockMultiTouch, { passive: false });
canvas.addEventListener('touchmove', blockMultiTouch, { passive: false });

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });

  if (pointers.size >= 2) {
    e.preventDefault();
    const dist = pinchDistance();
    if (pinchDist) applyZoom(zoom * (dist / pinchDist));
    pinchDist = dist;
    target = null;
    draw();
    return;
  }

  if (dragging) {
    if (Math.hypot(e.offsetX - downPos[0], e.offsetY - downPos[1]) > 6) dragMoved = true;
    const r = projection.rotate();
    const k = 90 / projection.scale();
    projection.rotate([
      r[0] + (e.offsetX - last[0]) * k,
      Math.max(-80, Math.min(80, r[1] - (e.offsetY - last[1]) * k))
    ]);
    last = [e.offsetX, e.offsetY];
    target = null;
    draw();
    return;
  }

  const hit = hitTest(e.offsetX, e.offsetY, 15);
  if (hit !== active) {
    active = hit;
    if (hit === -1) hideTip();
    spinning = hit === -1;
    draw();
  }
});
canvas.addEventListener('pointerleave', e => {
  if (e.pointerType === 'touch') return; // touch fires leave right after lift; tap handling owns this
  active = -1; spinning = true; hideTip(); draw();
});

function tick() {
  if (target) {
    const r = projection.rotate();
    const dx = ((target[0] - r[0] + 540) % 360) - 180;
    const dy = target[1] - r[1];
    if (Math.abs(dx) < .3 && Math.abs(dy) < .3) { target = null; }
    else { projection.rotate([r[0] + dx * .12, r[1] + dy * .12]); }
    draw();
  } else if (spinning && !dragging) {
    const r = projection.rotate();
    projection.rotate([r[0] + 0.13, r[1]]);
    draw();
  }
  requestAnimationFrame(tick);
}

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  land = topojson.feature(topo, topo.objects.countries);
  draw();
});

new ResizeObserver(resize).observe(canvas.parentElement);
resize();
tick();
</script>
</body>
</html>
